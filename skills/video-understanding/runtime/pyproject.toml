[project]
name = "video-understanding-runtime"
version = "0.1.0"
description = "Local read/fetch MCP runtime for Bilibili and YouTube video understanding."
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=2.0.0",
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1.0",
  "opencv-python-headless>=4.10.0",
  "webvtt-py>=0.5.1"
]

[project.scripts]
video-understanding-mcp = "video_understanding_runtime.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_understanding_runtime"]
