name: Video Understanding Audit

on:
  pull_request:
    paths:
      - "skills/video-understanding/**"
      - ".github/workflows/video-understanding-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/video-understanding/runtime

      - name: Compile Python
        run: |
          python -m compileall -q             skills/video-understanding/runtime/video_understanding_runtime             skills/video-understanding/runtime/scripts

      - name: Validate JSON and TOML
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          json.loads(Path("skills/video-understanding/evals/evals.json").read_text(encoding="utf-8"))
          tomllib.loads(Path("skills/video-understanding/runtime/pyproject.toml").read_text(encoding="utf-8"))
          print("JSON/TOML validation passed")
          PY

      - name: Runtime preflight
        working-directory: skills/video-understanding/runtime
        run: python scripts/preflight.py

      - name: Synthetic media-health smoke
        working-directory: skills/video-understanding/runtime
        run: |
          ffmpeg -hide_banner -loglevel error             -f lavfi -i testsrc2=duration=3:size=640x360:rate=30             -f lavfi -i sine=frequency=1000:duration=3             -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/healthy.mp4
          python - <<'PY'
          from pathlib import Path
          from video_understanding_runtime.media_health import inspect_media, completion_guard
          h = inspect_media(Path("/tmp/healthy.mp4"), transcript_source="none", transcript=[], mode="deep")
          assert h["audio"]["audio_present"] is True
          assert h["audio"]["audio_decodable"] is True
          assert h["video"]["visual_coverage_ratio"] >= 0.98
          assert h["completion"]["status"] == "PARTIAL"
          c = completion_guard(
              mode="deep",
              duration_seconds=3.0,
              video_present=True,
              visual_coverage_ratio=1.0,
              audio_present=True,
              audio_decodable=True,
              transcript_source="asr",
              transcript=[{"start": 0.0, "end": 2.95, "text": "ok"}],
          )
          assert c["status"] == "COMPLETE"
          print("media-health smoke passed")
          PY

      - name: MCP server smoke
        working-directory: skills/video-understanding/runtime
        run: |
          python -m video_understanding_runtime.server >/tmp/video-mcp.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/video-mcp.log' EXIT
          sleep 4
          python scripts/mcp_smoke.py
