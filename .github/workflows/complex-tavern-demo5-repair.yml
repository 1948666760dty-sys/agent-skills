name: One-time Complex Tavern demo.5 repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/complex-tavern-demo5-repair.yml']
permissions:
  contents: write
concurrency:
  group: complex-tavern-demo5-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == '1948666760dty-sys/agent-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact-base patch and check pure logic
        run: |
          python3 skills/complex-tavern-v4-demo/evals/repair_demo5.py --apply > /tmp/tavern-demo5-apply.json
          python3 skills/complex-tavern-v4-demo/evals/repair_demo5.py > /tmp/tavern-demo5-check.json
          git diff --exit-code -- skills/complex-tavern/SKILL.md skills/no-rush/SKILL.md
      - name: Commit only approved Demo and audit files
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'skills/complex-tavern-v4-demo/SKILL.md',
              'skills/complex-tavern-v4-demo/README.md',
              'skills/README.md',
          }
          tracked = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not tracked <= allowed:
              raise SystemExit('Unexpected tracked modification: ' + repr(tracked - allowed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- skills/complex-tavern-v4-demo/SKILL.md skills/complex-tavern-v4-demo/README.md skills/README.md skills/complex-tavern-v4-demo/evals/RESULTS-demo.5.json skills/complex-tavern-v4-demo/evals/AUDIT-demo.5.md
          git diff --cached --check
          git commit -m 'complex-tavern demo.5: fix premature stopping, preserve time agency and split footer categories'
          git push origin HEAD:main
          git rev-parse HEAD
      - name: Report limited test scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/tavern-demo5-check.json').read_text())
          print('Pure logical model cases:', len(r['logical_model_cases']))
          print('Targeted document checks:', len(r['document_checks']))
          print('No LLM gameplay, external Runtime, persistence or historical 80-case behavior suite was run.')
          PY
